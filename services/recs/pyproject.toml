[project]
name = "webflix-recs"
version = "0.1.0"
description = "Webflix offline recommendation pipeline: behaviour simulator, event lake compaction, datasets, models, evaluation, artefacts and experiment analysis."
readme = "README.md"
requires-python = ">=3.13,<3.14"
# Exact pins: the lock file pins the whole tree with hashes; these keep `uv sync` honest about
# what the code was written and measured against. Each heavy dependency is justified in README.md.
dependencies = [
  "boto3==1.44.9",
  "jsonschema-rs==0.62.0",
  "numpy==2.5.5",
  "orjson==3.13.0",
  "polars==2.1.0",
  "scikit-learn==1.9.1",
  "scipy==1.18.1",
  "threadpoolctl==3.8.0",
]

[project.scripts]
webflix-recs = "webflix_recs.cli:main"

[dependency-groups]
dev = [
  "moto[server]==5.2.5",
  "mypy==2.4.1",
  "pytest==9.2.0",
  "ruff==0.17.6",
]

[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/webflix_recs"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "webflix_recs/_schemas"

[tool.uv]
# Never fall back to building from source: every dependency must ship a wheel for macOS arm64
# and Linux (x86_64, aarch64) that needs no system library.
no-build-package = [
  "boto3",
  "jsonschema-rs",
  "numpy",
  "orjson",
  "polars",
  "scikit-learn",
  "scipy",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "PL", "PT", "NPY", "PERF", "C4", "PIE", "RET",
  "TID", "TCH", "ARG", "PTH", "S",
]
ignore = [
  "PLR0913", # pipeline stages take many explicit parameters on purpose
  "PLR2004", # domain constants are named where they matter; small literals in maths are fine
  "PLR0912",
  "PLR0915",
  "PLR0911",
  "S101",    # assert is used for internal invariants and in tests
  "S311",    # random numbers here are simulation, never security
  "S603",    # subprocess runs our own Node scripts with fixed arguments
  "S607",
  "RUF001",
  "RUF002",
  "RUF003",
  "TC001",   # with postponed annotations, moving imports under TYPE_CHECKING is churn, not safety
  "TC002",
  "TC003",
  "PLR0917", # keyword-only is used where it helps; positional pipelines stay readable
  "N818",    # PublishRefused, LeakError... read better than ...Error everywhere
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "S", "ARG", "PLC0415", "PT018"]
# Markdown table rendering: long format strings read better unbroken.
"src/webflix_recs/evaluation/summary.py" = ["E501", "ARG005"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
mypy_path = "src"
files = ["src", "tests"]
plugins = []

[[tool.mypy.overrides]]
module = ["sklearn.*", "scipy.*", "boto3.*", "botocore.*", "moto.*", "jsonschema_rs.*", "threadpoolctl.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "slow: end-to-end tests that run the simulator and the pipeline at smoke size",
  "node: needs Node.js and the repository's TypeScript packages",
]
filterwarnings = ["error::DeprecationWarning:webflix_recs.*"]
