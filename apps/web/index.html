    <style>
      /* Boot splash: painted before any script or stylesheet loads, so the first frame is the
         brand on the canvas colour, never white. Values mirror --color-canvas and the mark. */
      html, body { margin: 0; background: #0b0c0f; }
      .boot-splash { min-height: 100dvh; display: grid; place-items: center; }
      .boot-splash svg { width: 4rem; height: 4rem; animation: boot-pulse 1.6s cubic-bezier(0.2, 0, 0, 1) infinite; }
      @keyframes boot-pulse { 50% { opacity: 0.55; transform: scale(0.94); } }
      @media (prefers-reduced-motion: reduce) { .boot-splash svg { animation: none; } }
    </style>
