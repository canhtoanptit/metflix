<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0b0c0f" />
    <meta name="description" content="Webflix: films, series and originals. Watch anywhere." />
    <title>Webflix</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <style>
      /* Boot splash: painted before any script or stylesheet loads, so the first frame is the
         brand on the canvas colour, never white. Values mirror --color-canvas and <BrandMark>:
         the same "W" path and viewBox (packages/ui/src/brand), size, gradient and pulse, so the
         hand-over to React's <Splash> (which continues this pulse's phase) is invisible. */
      html, body { margin: 0; background: #0b0c0f; }
      .boot-splash { min-height: 100dvh; display: grid; place-items: center; }
      .boot-splash svg { width: 4rem; height: 4rem; animation: boot-pulse 1.6s cubic-bezier(0.2, 0, 0, 1) infinite; }
      @keyframes boot-pulse { 50% { opacity: 0.55; transform: scale(0.94); } }
      @media (prefers-reduced-motion: reduce) { .boot-splash svg { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-splash" aria-busy="true">
        <svg viewBox="-162.26000000000002 -377.26 1483.52 1483.52" aria-label="Loading Webflix" role="img">
          <defs><linearGradient id="boot-g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffc04d" /><stop offset="1" stop-color="#ff8a1a" /></linearGradient></defs>
          <path fill="url(#boot-g)" d="M192 729 0 0H251L319 337L348 507H359L393 340L463 0H707L779 334L816 509H825L854 329L916 0H1159L977 729H684L618 433L585 285H577L547 432L486 729Z" />
        </svg>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
