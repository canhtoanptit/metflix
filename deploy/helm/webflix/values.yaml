# Webflix Helm chart: production-leaning defaults.
#
# Local kind overrides live in deploy/kind/values.yaml. Every key is validated by
# values.schema.json. docs/KUBERNETES.md is the reference for the important knobs.

nameOverride: ""
fullnameOverride: ""

# --- Images --------------------------------------------------------------------------------

image:
  # Prepended to every first-party repository, e.g. "ghcr.io/acme/".
  registry: ""
  pullPolicy: IfNotPresent
  pullSecrets: []

# --- Application configuration (non-secret; becomes the ConfigMap the pods read) -----------

config:
  # The origin users load the app from. https makes cookies Secure and __Host- prefixed and
  # adds HSTS. Empty: derived from httpRoute.hostnames[0] and gateway.tls, else
  # http://localhost:8080.
  publicOrigin: ""
  # "production" refuses the development media token key.
  environment: production
  logLevel: info
  # Rate-limit overrides as "limit/windowSec", keyed by policy name (`email-lookup` or
  # `emailLookup` both become WEBFLIX_RATE_LIMIT_EMAIL_LOOKUP), so a policy the API adds later
  # needs no chart change. Empty or absent keeps the application's strict defaults.
  rateLimits: {}
  # Proxies that append to X-Forwarded-For in front of the API: the gateway (1), plus one per
  # load balancer in front of it. The client IP used for rate limiting is read that many
  # entries from the right; anything a client sends itself is ignored.
  trustedProxyHops: 1
  # Lifetime of signed media URLs.
  mediaTokenTtlSec: 21600
  # Seconds between scheduler ticks in the worker (stats rollups, daily baseline, cleanup).
  schedulerIntervalSec: 300
  # Prefix of every key in Valkey (lets environments share one Valkey).
  valkeyKeyPrefix: "webflix:"
  # PostgreSQL budgets per role, in milliseconds (docs/BACKEND.md §6). Each process uses its
  # role's: the API `request` (statement 5000 on the server / query 7000 on the client), the
  # worker `background` (60000 / 65000), migrate and seed `maintenance` (600000 / 605000). The
  # client-side `queryMs` fires only when the server cannot answer (a partition, a lost host):
  # it must exceed `statementMs`, or both be 0 (none). Empty keeps the role's defaults.
  databaseTimeouts:
    request: {}
    background: {}
    maintenance: {}
  # TCP keepalive on database connections: first probe after this many ms idle (0: off).
  # Empty: 10000. Interval and count are the pods' (tcpKeepalive below).
  databaseKeepAliveMs: null
  # Extra environment variables for the API, worker and jobs (name: value).
  extraEnv: {}

  # --- Milestone 2 areas (docs/BACKEND.md §4). An empty string or null keeps the application's
  # default for the environment; each key names the variable it sets. Credentials never go
  # here: they come from secrets.envFrom (provider keys) or the chart's app Secret.
  identity:
    # WEBFLIX_OIDC_PROVIDERS: consumer issuers offered, in button order (google, apple,
    # keycloak). Empty: google,apple; in production an issuer without a client is not offered.
    oidcProviders: ""
    # A real Google client (its secret: WEBFLIX_OIDC_GOOGLE_CLIENT_SECRET in secrets.envFrom).
    google:
      clientId: ""
      issuer: ""
    # Sign in with Apple (its key: WEBFLIX_OIDC_APPLE_PRIVATE_KEY in secrets.envFrom).
    apple:
      clientId: ""
      teamId: ""
      keyId: ""
      issuer: ""
    # Keycloak as a consumer issuer (optional on Kubernetes): the realm URL and a client.
    keycloak:
      issuer: ""
      clientId: ""
  email:
    # WEBFLIX_EMAIL_SENDER: smtp (a relay, or the in-chart mail catcher), http (Resend's API;
    # key WEBFLIX_EMAIL_HTTP_API_KEY in secrets.envFrom), outbox (the database: every replica
    # reads it, nothing is delivered) or memory (one process). Empty: smtp when mailcatcher is
    # enabled, else the application's default (memory, which delivers nothing in production
    # and says so at every start).
    sender: ""
    # WEBFLIX_EMAIL_FROM, e.g. "Webflix <no-reply@example.com>".
    from: ""
    smtp:
      # Empty with mailcatcher.enabled: the in-chart catcher.
      host: ""
      port: null
      # none (the catcher) | implicit (TLS from the first byte); credentials need TLS.
      tls: ""
      # Its password: WEBFLIX_SMTP_PASSWORD in secrets.envFrom.
      username: ""
    http:
      url: ""
      provider: ""
  billing:
    # WEBFLIX_PAYMENT_PROVIDER: stripe (keys STRIPE_SECRET_KEY, STRIPE_PUBLISHABLE_KEY,
    # STRIPE_WEBHOOK_SECRET in secrets.envFrom; the web app's CSP then admits Stripe.js), fake
    # (refused in production; its form is routed at /_pay) or none. Empty: fake outside
    # production, none in production (GET /billing/config says so, checkouts answer 503
    # payments_not_configured). `memory` (in process, tests) is refused in production.
    paymentProvider: ""
    # WEBFLIX_BILLING_GRACE_SEC: past_due stays entitled this long after a failed renewal.
    graceSec: null
    # The fake provider (development only).
    fake:
      delivery: ""
      promotions: ""
      retriesExhausted: ""
  events:
    # WEBFLIX_EVENT_SINK: lake (gzip NDJSON under events/ in the bucket, read by the pipeline)
    # or memory (nothing kept).
    sink: lake
    # WEBFLIX_CONSENT_MODE: opt-in | opt-out | off. Empty: opt-in.
    consentMode: ""
    # WEBFLIX_EXPORT_EVENTS: batch (the pipeline's export-events job reads the member's events:
    # pipeline.jobs.exportEvents) or inline (the export job reads up to 13 months of hours
    # itself: small deployments only).
    exportEvents: batch
    # WEBFLIX_DELETION_COOLING_OFF_SEC (default 14 days), the retention of raw events and
    # aggregates in days (396 / 1126), and the life of a data export's link (7 days).
    deletionCoolingOffSec: null
    retentionDays: null
    aggregatesRetentionDays: null
    exportLinkTtlSec: null
    # WEBFLIX_RELEASE, the app.version of server events. Empty: the API image's tag.
    release: ""
  experiments:
    # WEBFLIX_EXPERIMENTS_PROPAGATION_SEC: how far ahead a staff status change takes effect, so
    # every replica's cached definitions agree from that instant. null: 60 s on Kubernetes.
    propagationSec: null
  recommendations:
    # WEBFLIX_RECOMMENDATION_STORE: database (PostgreSQL) or memory.
    store: database
    # WEBFLIX_RECS_DEFAULT_POLICY: learned | rules; WEBFLIX_RECS_EXPLORE_SHARE: 0..1.
    defaultPolicy: ""
    exploreShare: null
  staff:
    # WEBFLIX_STAFF_VERIFIER: oidc | memory. Empty: oidc when an issuer is known (issuer below,
    # or keycloak.enabled), else the application's default (oidc against the development issuer
    # outside production; memory in production, which admits nobody).
    verifier: ""
    # WEBFLIX_STAFF_ISSUER: the exact staff issuer (https in production). Empty with
    # keycloak.enabled: the in-chart realm.
    issuer: ""
    # WEBFLIX_STAFF_ALGORITHMS (RS256 and/or ES256). Empty: RS256.
    algorithms: ""

# Secrets the application needs besides the data stores' credentials.
secrets:
  # Name of an existing Secret providing WEBFLIX_MEDIA_TOKEN_KEYS ("id:secret[,id:secret]",
  # secret >= 32 characters; the first signs, all verify: rotate in two phases, see
  # docs/KUBERNETES.md §5).
  # Empty: the chart generates one key on first install and keeps it across upgrades.
  # Rotate in two phases (docs/KUBERNETES.md §5): add the new key as verify-only, roll; then
  # promote it to first, roll; retire the old one after the token lifetime.
  existingSecret: ""
  # The application's own secrets besides the media keys: WEBFLIX_PSEUDONYM_KEY (the HMAC key of
  # the events' pseudonymous subjects: never replace it, or every member's history splits in
  # two) and, outside production, WEBFLIX_DEV_IDP_SECRET and WEBFLIX_PAYMENTS_FAKE_WEBHOOK_SECRET
  # (shared by every replica). Empty: generated on first install and kept, like the data
  # stores' credentials. Or name an existing Secret holding them.
  appExistingSecret: ""
  # More Secrets whose every key becomes an environment variable of the API, worker and Jobs:
  # provider credentials (STRIPE_SECRET_KEY, STRIPE_PUBLISHABLE_KEY, STRIPE_WEBHOOK_SECRET,
  # WEBFLIX_OIDC_GOOGLE_CLIENT_SECRET, WEBFLIX_OIDC_APPLE_PRIVATE_KEY,
  # WEBFLIX_OIDC_KEYCLOAK_CLIENT_SECRET, WEBFLIX_SMTP_PASSWORD, WEBFLIX_EMAIL_HTTP_API_KEY,
  # WEBFLIX_EMAIL_WEBHOOK_SECRET). Names only; the Secrets are yours.
  envFrom: []
  # Generated credentials need `lookup` (a live cluster) to stay stable across renders; the
  # chart refuses to generate them under `helm template` / GitOps renderers unless this is set
  # (throwaway renders only, e.g. CI schema checks). Use the existingSecret values instead.
  generateWithoutCluster: false

# TLS trust for the API, worker and Jobs.
tls:
  # Extra certificate authorities, for managed services whose certificates chain to a private
  # CA (RDS, Cloud SQL, ElastiCache, an internal S3 endpoint): a PEM bundle in a Secret or a
  # ConfigMap, mounted and passed as NODE_EXTRA_CA_CERTS. node-postgres verifies
  # `sslmode=require` fully (chain and hostname), so this is what makes it connect.
  extraCaCerts:
    secretName: ""
    configMapName: ""
    key: ca.crt

# --- API: HTTP serving (/api, /media, /cdn) ------------------------------------------------

api:
  image:
    repository: webflix-api
    # Defaults to the chart's appVersion.
    tag: ""
    # Pin by digest in production (overrides the tag).
    digest: ""
  # Ignored while autoscaling is enabled.
  replicas: 3
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 12
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 0
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1
  # Postgres connections per pod: keep (maxReplicas + worker replicas + 2) x poolMax below
  # the server's max_connections.
  databasePoolMax: 10
  # On SIGTERM: fail /readyz, keep serving this long (endpoint propagation to the gateway),
  # then drain in-flight requests. terminationGracePeriodSeconds must exceed it by 30 s.
  shutdownDelaySec: 5
  terminationGracePeriodSeconds: 40
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      memory: 512Mi
  extraEnv: {}
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # Empty: spread over zones and nodes (best effort).
  topologySpreadConstraints: []
  priorityClassName: ""

# --- Worker: job consumer (Valkey Streams) and scheduler ----------------------------------

worker:
  enabled: true
  # Consumers share the queue (consumer group); a delivery abandoned by a dead pod is
  # reclaimed by another one.
  replicas: 2
  # Jobs one pod processes concurrently.
  concurrency: 4
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1
  terminationGracePeriodSeconds: 30
  resources:
    requests:
      cpu: 100m
      memory: 192Mi
    limits:
      memory: 384Mi
  extraEnv: {}
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  priorityClassName: ""

# --- Web: the single-page app (static files, nginx) ---------------------------------------

web:
  image:
    repository: webflix-web
    tag: ""
    digest: ""
  replicas: 2
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1
  terminationGracePeriodSeconds: 30
  # Security headers on every SPA response (mounted over the image's default). Media and XHR
  # may use any https origin for titles that fall back to an external HLS stream.
  contentSecurityPolicy: >-
    default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';
    img-src 'self' data: blob:; font-src 'self'; media-src 'self' blob: https:;
    connect-src 'self' https:; worker-src 'self' blob:; manifest-src 'self';
    object-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      memory: 128Mi
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  priorityClassName: ""

# --- Database migrations and seed (Jobs, one per release revision) ------------------------

migrations:
  enabled: true
  backoffLimit: 6
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 86400
  resources:
    requests:
      cpu: 100m
      memory: 192Mi
    limits:
      memory: 384Mi

seed:
  # Catalog, search index, synthetic stats and the demo account. Idempotent: skipped when
  # nothing changed, so it runs on every upgrade.
  enabled: true
  # The publicly documented demo account (demo@webflix.dev): off for real deployments; the
  # kind values turn it on.
  demo: false
  # Media manifest uploaded with the packaged media; when absent, titles play the external
  # HLS fallback until a later seed finds it.
  manifest: "blob:manifests/media.json"
  # Informational: the manifest checksum the last seed was triggered for (set by tooling).
  mediaChecksum: ""
  backoffLimit: 6
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 86400
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      memory: 768Mi

# --- Recommendation pipeline and privacy jobs (services/recs; CronJobs) ---------------------
# The `webflix-recs` image against the bucket through its S3 API, plus a Node image with the
# repository's packages for the steps that need TypeScript (the catalogue snapshot, the rule
# engine baseline of train-and-score, the product's importers). services/recs/README.md "Jobs".

pipeline:
  enabled: false
  image:
    repository: webflix-recs
    tag: ""
    digest: ""
  tools:
    image:
      repository: webflix-tools
      tag: ""
      digest: ""
  # The store every job reads and writes: the product's bucket. Empty: s3://<bucket>.
  store: ""
  # Native thread budget of each job (WEBFLIX_RECS_THREADS).
  threads: 2
  # Worker processes of each job (webflix-recs --workers). null: the pipeline's default, the CPUs
  # the container may use (its cgroup quota, i.e. resources.limits.cpu) minus one, 1 to 12; its
  # pools are spawned, never forked (finding K5).
  workers: null
  # How the jobs reach the staff API (erasures, exports, experiment definitions): a service
  # account of the staff issuer with the `admin` and `experiments` roles of webflix-admin.
  staffApi:
    # Empty: the API's Service (http://<api>/api/admin/v1).
    url: ""
    # The issuer's token endpoint (client credentials). Empty: the in-chart Keycloak realm when
    # keycloak.enabled; outside production the development issuer's (http://<api>/dev-idp/staff/token).
    tokenUrl: ""
    clientId: webflix-jobs
    # Secret with the client's secret under `client-secret`. Empty: Keycloak's generated one
    # (keycloak.enabled), or outside production the development issuer's published secret.
    existingSecret: ""
  # The lake lease is a create-only write (PutObject with If-None-Match: *). Garage accepts the
  # header and ignores it (measured on v2.5.0: every concurrent writer "wins"), and the pipeline
  # then refuses to run compact, erase or export-events (exit 10) unless told that the scheduler
  # is the lock. So with the in-chart store the three run one after another in one CronJob, the
  # lake round, whose concurrencyPolicy Forbid is the lock, with WEBFLIX_RECS_LAKE_SERIALIZED=true.
  # auto: serialized with objectStore.enabled; separate CronJobs (each taking the lease) with an
  # external store that honours the header (AWS S3, R2). jobs.*.enabled and graceMinutes still
  # apply to each step.
  lake:
    serialize: auto
    schedule: "*/5 * * * *"
    compactEveryMinutes: 60
    eraseEveryHours: 24
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  # A job that runs longer is stopped (the lake lease it holds expires after 6 h anyway).
  activeDeadlineSeconds: 3600
  backoffLimit: 1
  ttlSecondsAfterFinished: 3600
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "2"
      memory: 2Gi
  jobs:
    # Hourly: each closed hour (end + grace) into one Parquet file.
    compact:
      enabled: true
      schedule: "20 * * * *"
      graceMinutes: 15
      deleteSources: false
    # Erased members out of the lake, datasets and artefacts; confirmed through the staff API.
    erase:
      enabled: true
      schedule: "40 3 * * *"
    # The events of pending data exports (WEBFLIX_EXPORT_EVENTS=batch). The grace must exceed
    # the scheduler tick (playback events reach the lake through an outbox on each tick).
    exportEvents:
      enabled: true
      schedule: "*/5 * * * *"
      graceMinutes: 15
    # Experiment results from the lake; the worker imports them on its next tick.
    analyse:
      enabled: true
      schedule: "30 4 * * *"
    # Catalogue snapshot, train-and-score (prepare, the Node rule-engine step, finish), publish
    # (the gate may refuse: then nothing changes) and the import of the published run.
    trainAndScore:
      enabled: true
      schedule: "0 4 * * *"
  # Extra environment for the pipeline's containers (name: value).
  extraEnv: {}

# --- PostgreSQL: in-cluster (official image) or external -----------------------------------

postgresql:
  # false: use externalDatabase.
  enabled: true
  image:
    repository: postgres
    tag: 19.0-alpine3.24
    digest: sha256:8b0ff4cdf221f0c53d7fcda681d3b461be725c492cd881c5ec9c0ad25023f188
  database: webflix
  username: webflix
  auth:
    # Existing Secret with the password under `passwordKey`. Empty: generated once and kept.
    existingSecret: ""
    passwordKey: password
  maxConnections: 200
  sharedBuffers: 256MB
  persistence:
    size: 10Gi
    storageClass: ""
    accessModes: [ReadWriteOnce]
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 1Gi
  nodeSelector: {}
  tolerations: []
  affinity: {}

externalDatabase:
  # postgres://USER@HOST:5432/DB?sslmode=require (no password: it comes from the Secret).
  # Private CA: tls.extraCaCerts.
  url: ""
  existingSecret: ""
  passwordKey: password
  # Mutual TLS: a kubernetes.io/tls Secret, mounted at /etc/webflix/tls/database; add
  # `&sslcert=/etc/webflix/tls/database/tls.crt&sslkey=/etc/webflix/tls/database/tls.key`
  # to the URL.
  clientCertSecret: ""

# --- Valkey: in-cluster (official image) or external ---------------------------------------

valkey:
  # false: use externalValkey.
  enabled: true
  image:
    repository: valkey/valkey
    tag: 9.2.0-alpine3.24
    digest: sha256:c8e2d17498838af5d91e12eb7c11220b3434a7b7131a333e3af52ad5e0b80882
  auth:
    existingSecret: ""
    passwordKey: password
  # Keys holding stream leases, rate-limit state and queued jobs must never be evicted:
  # writes fail (503) when full instead. Size it with headroom and alert on used memory.
  # The container limit must cover maxMemory twice (an AOF rewrite forks, and copy-on-write
  # can duplicate every page written meanwhile) plus ~128 MiB for buffers and the process:
  # limit >= 2 x maxMemory + 128Mi.
  maxMemory: 512mb
  # AOF: leases, counters and queued jobs survive a restart (at most ~1 s of writes lost).
  persistence:
    enabled: true
    size: 2Gi
    storageClass: ""
    accessModes: [ReadWriteOnce]
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 1152Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}

externalValkey:
  # redis://HOST:6379/0 or rediss://HOST:6380/0 (TLS). Standalone/primary endpoint.
  url: ""
  existingSecret: ""
  passwordKey: password

# --- Object storage: in-cluster Garage (S3 API) or any external S3 ---------------------------

objectStore:
  # false: use externalS3.
  enabled: true
  image:
    repository: dxflrs/garage
    tag: v2.5.0
    digest: sha256:677e5b758e4425a325b811c425c026bf35a4bf42f7ddbaa773de3f4fd779a5a5
  bucket: webflix-media
  region: garage
  auth:
    # Existing Secret with `access-key-id` (GK + 24 hex), `secret-access-key` (64 hex),
    # `rpc-secret` (64 hex) and `admin-token`. Empty: generated once and kept.
    existingSecret: ""
  persistence:
    size: 20Gi
    storageClass: ""
    accessModes: [ReadWriteOnce]
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}

externalS3:
  # Empty endpoint: AWS S3 for `region`.
  endpoint: ""
  region: us-east-1
  bucket: webflix-media
  forcePathStyle: false
  # Secret with static keys; leave empty to use the pod's identity (IRSA, EKS Pod Identity,
  # Workload Identity) through serviceAccount.annotations.
  existingSecret: ""
  accessKeyIdKey: access-key-id
  secretAccessKeyKey: secret-access-key

# --- Keycloak: the staff issuer (optional; docs/BLUEPRINT-M2.md §8.3) -----------------------
# One Keycloak with an imported realm: the console client webflix-admin (code flow with PKCE),
# the webflix-admin-api audience on its access tokens, the five staff roles, demo staff (one
# per role) and the jobs' service account webflix-jobs. It serves HTTPS itself with a
# certificate from a CA the chart generates (or yours), and the API trusts that CA; the staff
# API then validates its tokens (config.staff.issuer defaults to this realm). Its own data is
# in the in-chart PostgreSQL (database `keycloak`) or `keycloak.database.url`.

keycloak:
  enabled: false
  image:
    repository: quay.io/keycloak/keycloak
    tag: "26.8.2"
    digest: sha256:7e66a96e4739239070aeaf72e4c5decf0f7f682cfc725b9f7ea2b336eaba38b3
  realm: webflix
  # The URL everyone reaches Keycloak at (browsers, the API, the jobs): the issuer is
  # <hostname>/realms/<realm>. Empty: https://<fullname>-keycloak:8443, which resolves inside
  # the namespace (kind: a browser needs a hosts entry and a port-forward; docs/KUBERNETES.md).
  hostname: ""
  tls:
    # kubernetes.io/tls Secret with the server certificate (and ca.crt). Empty: the chart
    # generates a CA and a certificate for the Service's names, kept across upgrades.
    secretName: ""
  database:
    # An external PostgreSQL for Keycloak: jdbc:postgresql://HOST:5432/DB, its user, and a
    # Secret with the password. Empty: the in-chart PostgreSQL, database and role `keycloak`
    # (created, or its password brought in line, by an init container at every start).
    jdbcUrl: ""
    username: ""
    existingSecret: ""
    passwordKey: password
  # Demo staff (staff-support, staff-billing, staff-content, staff-experiments, staff-admin,
  # staff-none): local and staging realms only.
  demoStaff: false
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi
  nodeSelector: {}
  tolerations: []
  affinity: {}

# --- Mail catcher (Mailpit; local clusters only) --------------------------------------------
# Catches everything the SMTP sender sends (config.email.sender defaults to smtp with it): read
# it with `kubectl port-forward svc/<fullname>-mailcatcher 8025` (web UI and REST API).

mailcatcher:
  enabled: false
  image:
    repository: axllent/mailpit
    tag: v1.34.0
    digest: sha256:23a2ef85bc50853ab3093645d1d64679afd8887e89da5e48a88940c172591a4e
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

# --- Routing (Gateway API) ------------------------------------------------------------------

gateway:
  # Create a dedicated Gateway. false: attach the routes to an existing one (parentRefs).
  enabled: true
  # GatewayClass of the installed implementation (Envoy Gateway's documentation calls its
  # class "eg"; kind uses "webflix", see deploy/kind/gateway.yaml).
  className: eg
  annotations: {}
  http:
    port: 80
  tls:
    enabled: false
    port: 443
    # Secret holding the certificate (type kubernetes.io/tls); cert-manager fills it when an
    # issuer is set.
    secretName: ""
    certManager:
      issuer: ""
      issuerKind: ClusterIssuer
    # Redirect plain HTTP to HTTPS.
    redirectHttp: true
  # Envoy Gateway only (applied if its CRDs exist): X-Request-Id handling at the edge.
  envoy:
    requestId: PreserveOrGenerate

httpRoute:
  enabled: true
  hostnames: []
  # Parent Gateways when gateway.enabled is false, e.g. [{name: shared, namespace: infra}].
  parentRefs: []
  # Request timeouts per backend (Gateway API duration; "0s" disables).
  timeouts:
    api: 60s
    media: 300s
    web: 30s
  # Envoy Gateway policies (applied only if its CRDs exist): retry a request that never
  # reached a backend (connection refused or reset before sending: safe for any method).
  envoy:
    retries: true

# --- Pods and security ----------------------------------------------------------------------

serviceAccount:
  create: true
  name: ""
  # e.g. eks.amazonaws.com/role-arn for S3 access through IRSA.
  annotations: {}

# Applied to every first-party pod.
# TCP keepalive probes in the API, worker and Job pods (namespaced "safe" sysctls, allowed by
# Pod Security `restricted` since Kubernetes 1.29; this chart needs 1.31). With the database
# clients' 10 s keepalive, a dead idle connection is noticed after 10 + 3 × 10 = 40 s instead of
# Linux's 10 + 9 × 75 s ≈ 11 min. Set to null where a policy engine forbids pod sysctls.
tcpKeepalive:
  intervalSec: 10
  probes: 3

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

networkPolicy:
  enabled: true
  # Where the gateway's proxies run: only they may reach the API and the web app.
  gateway:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: envoy-gateway-system
    podSelector: {}
  # Who may scrape /metrics (when metrics.serviceMonitor is used).
  metrics:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: monitoring
    podSelector: {}
  # DNS egress. Empty `to`: port 53 to any destination, which works with kube-dns/CoreDNS
  # pods and with NodeLocal DNSCache (a link-local IP on each node). Narrow it if you like,
  # e.g. [{namespaceSelector: {}, podSelector: {matchLabels: {k8s-app: kube-dns}}},
  #       {ipBlock: {cidr: 169.254.20.10/32}}].
  dns:
    to: []
  egress:
    # Restrict egress to DNS and the in-chart data stores; add rules for external services.
    restrict: true
    # Extra egress rules (NetworkPolicyEgressRule) for the API, worker and jobs, e.g.
    # [{to: [{ipBlock: {cidr: 10.20.0.0/16}}], ports: [{port: 5432, protocol: TCP}]}].
    extraRules: []

metrics:
  # Prometheus Operator ServiceMonitor for the API and worker /metrics.
  serviceMonitor:
    enabled: false
    interval: 30s
    labels: {}
  # prometheus.io/* annotations for annotation-based scrapers.
  podAnnotations: true
