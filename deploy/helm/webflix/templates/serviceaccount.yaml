{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "webflix.serviceAccountName" . }}
  labels:
    {{- include "webflix.labels" (list . "api") | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Nothing in Webflix talks to the Kubernetes API.
automountServiceAccountToken: false
{{- end }}
