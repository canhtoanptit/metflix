apiVersion: v1
kind: Service
metadata:
  name: {{ include "webflix.component" (list . "web") }}
  labels:
    {{- include "webflix.labels" (list . "web") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "webflix.selectorLabels" (list . "web") | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
      appProtocol: http
