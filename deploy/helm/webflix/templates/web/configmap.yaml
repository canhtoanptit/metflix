{{- /* nginx's add_header does not inherit into locations that add their own, so the image
includes this file in every location; the chart mounts it over the image's default. */ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "webflix.component" (list . "web") }}
  labels:
    {{- include "webflix.labels" (list . "web") | nindent 4 }}
data:
  security-headers.conf: |
    add_header Content-Security-Policy {{ .Values.web.contentSecurityPolicy | replace "\n" " " | trim | quote }} always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    {{- if .Values.gateway.tls.enabled }}
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    {{- end }}
