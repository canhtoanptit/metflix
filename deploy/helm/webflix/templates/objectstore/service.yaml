{{- if .Values.objectStore.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "webflix.component" (list . "objectstore") }}
  labels:
    {{- include "webflix.labels" (list . "objectstore") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "webflix.selectorLabels" (list . "objectstore") | nindent 4 }}
  ports:
    - name: s3
      port: 3900
      targetPort: s3
      protocol: TCP
      appProtocol: http
    - name: admin
      port: 3903
      targetPort: admin
      protocol: TCP
      appProtocol: http
{{- end }}
