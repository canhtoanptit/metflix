{{- $c := .Values.objectStore -}}
{{- if $c.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "webflix.component" (list . "objectstore") }}
  labels:
    {{- include "webflix.labels" (list . "objectstore") | nindent 4 }}
data:
  # Secrets (rpc_secret, admin_token) come from the environment, never from this file.
  garage.toml: |
    metadata_dir = "/var/lib/garage/meta"
    data_dir = "/var/lib/garage/data"
    db_engine = "sqlite"
    metadata_fsync = true
    replication_factor = 1
    rpc_bind_addr = "0.0.0.0:3901"
    rpc_public_addr = "127.0.0.1:3901"

    [s3_api]
    s3_region = {{ $c.region | quote }}
    api_bind_addr = "0.0.0.0:3900"
    root_domain = ".s3.garage.internal"

    [admin]
    api_bind_addr = "0.0.0.0:3903"
{{- end }}
