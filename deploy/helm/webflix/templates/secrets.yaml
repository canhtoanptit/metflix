{{- /*
Credentials the chart generates when no existing Secret is named. Each value is created once
and read back on every upgrade (lookup), and the Secrets are kept on uninstall: data stores
initialise themselves from them, so they must outlive the release like the volumes do.
For production, prefer existingSecret (External Secrets, Sealed Secrets, SOPS).
*/ -}}
{{- $generates := or (not .Values.secrets.existingSecret) (and .Values.postgresql.enabled (not .Values.postgresql.auth.existingSecret)) (and .Values.valkey.enabled (not .Values.valkey.auth.existingSecret)) (and .Values.objectStore.enabled (not .Values.objectStore.auth.existingSecret)) }}
{{- /* Without cluster access (helm template, Argo CD, Flux post-renderers) `lookup` sees nothing,
so generated credentials would change on every render and lock the data stores out. A list
lookup returns a typed List from a real API server; `helm lint` renders neither an install nor
an upgrade. */}}
{{- $offline := not (hasKey (lookup "v1" "Secret" .Release.Namespace "") "kind") }}
{{- if and $generates $offline (or .Release.IsInstall .Release.IsUpgrade) (not .Values.secrets.generateWithoutCluster) }}
{{- fail "webflix: rendering without cluster access (helm template, Argo CD, Flux…) cannot keep generated credentials stable. Create the Secrets and set secrets.existingSecret, postgresql.auth.existingSecret, valkey.auth.existingSecret and objectStore.auth.existingSecret (or use external services); set secrets.generateWithoutCluster=true only for throwaway renders such as CI schema checks." }}
{{- end }}
{{- if not .Values.secrets.existingSecret }}
{{- $name := include "webflix.mediaTokens.secretName" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "webflix.labels" (list . "api") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  WEBFLIX_MEDIA_TOKEN_KEYS: {{ include "webflix.persistedValue" (dict "ctx" . "secret" $name "key" "WEBFLIX_MEDIA_TOKEN_KEYS" "default" (printf "k1:%s" (randAlphaNum 48))) | quote }}
{{- end }}
{{- if and .Values.postgresql.enabled (not .Values.postgresql.auth.existingSecret) }}
{{- $name := include "webflix.component" (list . "postgresql") }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "webflix.labels" (list . "postgresql") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{ .Values.postgresql.auth.passwordKey }}: {{ include "webflix.persistedValue" (dict "ctx" . "secret" $name "key" .Values.postgresql.auth.passwordKey "default" (randAlphaNum 32)) | quote }}
{{- end }}
{{- if .Values.valkey.enabled }}
{{- $name := include "webflix.component" (list . "valkey") }}
{{- if not .Values.valkey.auth.existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "webflix.labels" (list . "valkey") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{ .Values.valkey.auth.passwordKey }}: {{ include "webflix.persistedValue" (dict "ctx" . "secret" $name "key" .Values.valkey.auth.passwordKey "default" (randAlphaNum 32)) | quote }}
{{- end }}
{{- end }}
{{- if and .Values.objectStore.enabled (not .Values.objectStore.auth.existingSecret) }}
{{- $name := include "webflix.component" (list . "objectstore") }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "webflix.labels" (list . "objectstore") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{- /* Garage key ids are "GK" + 24 hex digits; secrets and the RPC secret 64 hex digits. */}}
  access-key-id: {{ include "webflix.persistedValue" (dict "ctx" . "secret" $name "key" "access-key-id" "default" (printf "GK%s" (randAlphaNum 32 | sha256sum | trunc 24))) | quote }}
  secret-access-key: {{ include "webflix.persistedValue" (dict "ctx" . "secret" $name "key" "secret-access-key" "default" (randAlphaNum 64 | sha256sum)) | quote }}
  rpc-secret: {{ include "webflix.persistedValue" (dict "ctx" . "secret" $name "key" "rpc-secret" "default" (randAlphaNum 64 | sha256sum)) | quote }}
  admin-token: {{ include "webflix.persistedValue" (dict "ctx" . "secret" $name "key" "admin-token" "default" (randAlphaNum 48)) | quote }}
{{- end }}
