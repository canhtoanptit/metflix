{{- /* `helm test <release>`: the deployed stack answers end to end inside the cluster. */ -}}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "webflix.component" (list . "test") }}
  labels:
    {{- include "webflix.labels" (list . "test") | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    {{- toYaml .Values.podSecurityContext | nindent 4 }}
  containers:
    - name: smoke
      image: {{ include "webflix.image" (list . .Values.api.image) }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      # The API image is Node: no extra image to pull for the test.
      command:
        - node
        - --input-type=module
        - -e
        - |
          const api = "http://{{ include "webflix.component" (list . "api") }}";
          const ops = "http://{{ include "webflix.component" (list . "api") }}:4001";
          const web = "http://{{ include "webflix.component" (list . "web") }}";
          const checks = [
            [`${ops}/readyz`, (r, body) => r.status === 200 && body.includes('"ready"')],
            [`${api}/readyz`, (r) => r.status === 404],
            [`${api}/api/v1/plans`, (r, body) => r.status === 200 && body.includes('"premium"')],
            [`${web}/`, (r, body) => r.status === 200 && body.includes('<div id="root">')],
            [`${web}/assets/missing.js`, (r) => r.status === 404],
          ];
          let failed = 0;
          for (const [url, ok] of checks) {
            const response = await fetch(url, { signal: AbortSignal.timeout(10000) });
            const body = await response.text();
            const pass = ok(response, body);
            console.log(`${pass ? "ok  " : "FAIL"} ${response.status} ${url}`);
            if (!pass) failed += 1;
          }
          process.exit(failed ? 1 : 0);
      securityContext:
        {{- toYaml .Values.containerSecurityContext | nindent 8 }}
        runAsUser: 10001
        runAsGroup: 10001
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi
