apiVersion: v1
kind: Service
metadata:
  name: {{ include "webflix.component" (list . "api") }}
  labels:
    {{- include "webflix.labels" (list . "api") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "webflix.selectorLabels" (list . "api") | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
      appProtocol: http
    # Probes and metrics. The HTTPRoute only targets port 80, and the NetworkPolicy admits the
    # gateway to the http port only.
    - name: ops
      port: 4001
      targetPort: ops
      protocol: TCP
      appProtocol: http
