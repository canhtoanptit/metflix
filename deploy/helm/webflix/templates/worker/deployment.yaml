{{- $c := .Values.worker -}}
{{- if $c.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "webflix.component" (list . "worker") }}
  labels:
    {{- include "webflix.labels" (list . "worker") | nindent 4 }}
spec:
  replicas: {{ $c.replicas }}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      {{- include "webflix.selectorLabels" (list . "worker") | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        {{- include "webflix.labels" (list . "worker") | nindent 8 }}
        {{- with $c.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secrets: {{ include "webflix.secretsChecksum" . }}
        {{- include "webflix.metricsAnnotations" . | nindent 8 }}
        {{- with $c.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "webflix.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- include "webflix.imagePullSecrets" . | nindent 6 }}
      {{- with $c.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      # On SIGTERM the consumer stops reading and lets in-flight jobs settle (20 s at most);
      # anything still unsettled is reclaimed by another consumer, never lost. Each pod is a
      # consumer in the Valkey group, named after the pod (its hostname).
      terminationGracePeriodSeconds: {{ $c.terminationGracePeriodSeconds }}
      initContainers:
        {{- include "webflix.waitContainer" (list . (list "wait" "--timeout" "900")) | nindent 8 }}
      containers:
        - name: worker
          image: {{ include "webflix.image" (list . .Values.api.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: [worker]
          ports:
            - name: ops
              containerPort: 4001
              protocol: TCP
          {{- include "webflix.appEnv" . | nindent 10 }}
            # The worker has no shutdown delay: nothing routes traffic to it.
            - name: WEBFLIX_SHUTDOWN_DELAY_SEC
              value: "0"
            {{- include "webflix.extraEnv" $c.extraEnv | nindent 12 }}
          startupProbe:
            httpGet:
              path: /healthz
              port: ops
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: ops
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: ops
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
            runAsUser: 10001
            runAsGroup: 10001
          resources:
            {{- toYaml $c.resources | nindent 12 }}
          volumeMounts:
            {{- include "webflix.appVolumeMounts" . | nindent 12 }}
      volumes:
        {{- include "webflix.appVolumes" . | nindent 8 }}
      topologySpreadConstraints:
        {{- include "webflix.topologySpread" (list . "worker" $c.topologySpreadConstraints) | nindent 8 }}
      {{- with $c.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $c.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $c.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
