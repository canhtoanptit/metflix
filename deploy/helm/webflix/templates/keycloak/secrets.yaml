{{- if .Values.keycloak.enabled }}
{{- $k := .Values.keycloak -}}
{{- $name := include "webflix.keycloak.secretName" . -}}
{{- $origin := include "webflix.publicOrigin" . -}}
{{- $jobsSecret := include "webflix.persistedValue" (dict "ctx" . "secret" $name "key" "jobs-client-secret" "default" (randAlphaNum 40)) -}}
{{- $staffPassword := include "webflix.persistedValue" (dict "ctx" . "secret" $name "key" "staff-password" "default" (randAlphaNum 24)) -}}
{{- $audience := dict "name" "webflix-admin-api audience" "protocol" "openid-connect" "protocolMapper" "oidc-audience-mapper" "consentRequired" false "config" (dict "included.custom.audience" "webflix-admin-api" "access.token.claim" "true" "id.token.claim" "false" "introspection.token.claim" "true") -}}
{{- $roles := list -}}
{{- range $role := include "webflix.staffRoles" . | fromJsonArray }}
{{- $roles = append $roles (dict "name" $role "description" (printf "Webflix staff: %s" $role)) -}}
{{- end -}}
{{- /*
The realm, imported at every start when it does not exist yet (Keycloak skips a realm that
exists: change it in Keycloak afterwards, or delete it to import again). Kept in a Secret: it
holds the jobs client's secret and the demo staff's password.
*/ -}}
{{- $clients := list
  (dict
    "clientId" "webflix-admin"
    "name" "Webflix staff console"
    "description" "The admin console: authorisation code with PKCE, public client"
    "enabled" true
    "publicClient" true
    "standardFlowEnabled" true
    "implicitFlowEnabled" false
    "directAccessGrantsEnabled" false
    "serviceAccountsEnabled" false
    "frontchannelLogout" true
    "redirectUris" (list (printf "%s/admin/auth/callback" $origin))
    "webOrigins" (list $origin)
    "attributes" (dict "pkce.code.challenge.method" "S256" "post.logout.redirect.uris" (printf "%s/admin/" $origin))
    "protocolMappers" (list $audience))
  (dict
    "clientId" "webflix-jobs"
    "name" "Webflix batch jobs"
    "description" "The pipeline's service account (erase, export-events, analyse-experiments)"
    "enabled" true
    "publicClient" false
    "clientAuthenticatorType" "client-secret"
    "secret" $jobsSecret
    "standardFlowEnabled" false
    "implicitFlowEnabled" false
    "directAccessGrantsEnabled" false
    "serviceAccountsEnabled" true
    "protocolMappers" (list $audience))
-}}
{{- $users := list (dict "username" "service-account-webflix-jobs" "enabled" true "serviceAccountClientId" "webflix-jobs" "clientRoles" (dict "webflix-admin" (list "admin" "experiments"))) -}}
{{- if $k.demoStaff }}
{{- range $role := concat (include "webflix.staffRoles" . | fromJsonArray) (list "none") }}
{{- $users = append $users (dict
  "username" (printf "staff-%s" $role)
  "enabled" true
  "email" (printf "staff-%s@staff.webflix.test" $role)
  "emailVerified" true
  "firstName" "Staff"
  "lastName" (title $role)
  "credentials" (list (dict "type" "password" "value" $staffPassword "temporary" false))
  "clientRoles" (dict "webflix-admin" (ternary (list) (list $role) (eq $role "none")))) -}}
{{- end }}
{{- end }}
{{- $realm := dict
  "realm" $k.realm
  "displayName" "Webflix staff"
  "enabled" true
  "sslRequired" "external"
  "accessTokenLifespan" 300
  "bruteForceProtected" true
  "roles" (dict "client" (dict "webflix-admin" $roles))
  "clients" $clients
  "users" $users
-}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "webflix.labels" (list . "keycloak") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  admin-password: {{ include "webflix.persistedValue" (dict "ctx" . "secret" $name "key" "admin-password" "default" (randAlphaNum 32)) | quote }}
  db-password: {{ include "webflix.persistedValue" (dict "ctx" . "secret" $name "key" "db-password" "default" (randAlphaNum 32)) | quote }}
  jobs-client-secret: {{ $jobsSecret | quote }}
  staff-password: {{ $staffPassword | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "webflix.component" (list . "keycloak-realm") }}
  labels:
    {{- include "webflix.labels" (list . "keycloak") | nindent 4 }}
type: Opaque
stringData:
  {{ $k.realm }}-realm.json: {{ $realm | toJson | quote }}
{{- if not $k.tls.secretName }}
{{- $tlsName := include "webflix.keycloak.tlsSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $tlsName }}
---
# The server certificate Keycloak serves, from a CA the chart generates once (kept across
# upgrades; delete the Secret to issue a new pair). The API, the worker and the pipeline trust
# the CA (NODE_EXTRA_CA_CERTS, SSL_CERT_FILE) unless tls.extraCaCerts names another bundle.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $tlsName }}
  labels:
    {{- include "webflix.labels" (list . "keycloak") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: kubernetes.io/tls
data:
{{- if and $existing $existing.data (hasKey $existing.data "tls.crt") }}
  tls.crt: {{ index $existing.data "tls.crt" }}
  tls.key: {{ index $existing.data "tls.key" }}
  ca.crt: {{ index $existing.data "ca.crt" }}
{{- else }}
{{- $service := include "webflix.component" (list . "keycloak") }}
{{- $host := regexReplaceAll "^https?://([^:/]+).*$" (include "webflix.keycloak.url" .) "${1}" }}
{{- $names := uniq (list $host $service (printf "%s.%s" $service .Release.Namespace) (printf "%s.%s.svc" $service .Release.Namespace) (printf "%s.%s.svc.cluster.local" $service .Release.Namespace) "localhost") }}
{{- $ca := genCA (printf "%s staff issuer CA" (include "webflix.fullname" .)) 3650 }}
{{- $cert := genSignedCert $host (list "127.0.0.1") $names 3650 $ca }}
  tls.crt: {{ $cert.Cert | b64enc }}
  tls.key: {{ $cert.Key | b64enc }}
  ca.crt: {{ $ca.Cert | b64enc }}
{{- end }}
{{- end }}
{{- end }}
