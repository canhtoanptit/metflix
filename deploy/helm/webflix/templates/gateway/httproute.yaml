{{- $r := .Values.httpRoute -}}
{{- $g := .Values.gateway -}}
{{- if $r.enabled }}
{{- $api := include "webflix.component" (list . "api") }}
{{- $web := include "webflix.component" (list . "web") }}
{{- $redirect := and $g.enabled $g.tls.enabled $g.tls.redirectHttp (not $r.parentRefs) }}
# Routing (docs/BACKEND.md §5): /api, /media, /cdn, /dev-idp and /_pay go to the API (the last
# two serve the development stand-ins outside production, 404 otherwise), everything else to
# the web app. The API's ops endpoints (/healthz, /readyz, /metrics) are deliberately not routed.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "webflix.fullname" . }}
  labels:
    {{- include "webflix.labels" (list . "gateway") | nindent 4 }}
spec:
  parentRefs:
    {{- if $r.parentRefs }}
    {{- toYaml $r.parentRefs | nindent 4 }}
    {{- else if $g.enabled }}
    - name: {{ include "webflix.fullname" . }}
      sectionName: {{ ternary "https" "http" $redirect }}
    {{- else }}
    {{- fail "httpRoute.parentRefs is required when gateway.enabled is false" }}
    {{- end }}
    {{- if and $g.enabled $g.tls.enabled (not $redirect) (not $r.parentRefs) }}
    - name: {{ include "webflix.fullname" . }}
      sectionName: https
    {{- end }}
  {{- with $r.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: {{ $api }}
          port: 80
      timeouts:
        request: {{ $r.timeouts.api }}
    # Signed media: long transfers (Range requests) on slow links.
    - matches:
        - path:
            type: PathPrefix
            value: /media
      backendRefs:
        - name: {{ $api }}
          port: 80
      timeouts:
        request: {{ $r.timeouts.media }}
    - matches:
        - path:
            type: PathPrefix
            value: /cdn
      backendRefs:
        - name: {{ $api }}
          port: 80
      timeouts:
        request: {{ $r.timeouts.media }}
    # The development stand-ins' prefixes belong to the API in every environment: outside
    # production it serves the development OpenID issuer (Google, Apple and the staff realm) and,
    # with the fake payment provider, its payment form; in production, or with another provider,
    # it answers 404 for them, as the Worker does. (Routed to the web app, they would get the
    # SPA's shell, a 200 page, which says nothing true about the deployment.)
    - matches:
        - path:
            type: PathPrefix
            value: /dev-idp
        - path:
            type: PathPrefix
            value: /_pay
      backendRefs:
        - name: {{ $api }}
          port: 80
      timeouts:
        request: {{ $r.timeouts.api }}
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ $web }}
          port: 80
      timeouts:
        request: {{ $r.timeouts.web }}
{{- if $redirect }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "webflix.component" (list . "https-redirect") }}
  labels:
    {{- include "webflix.labels" (list . "gateway") | nindent 4 }}
spec:
  parentRefs:
    - name: {{ include "webflix.fullname" . }}
      sectionName: http
  {{- with $r.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
{{- end }}
{{- end }}
