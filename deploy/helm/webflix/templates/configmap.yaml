apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "webflix.component" (list . "config") }}
  labels:
    {{- include "webflix.labels" (list . "api") | nindent 4 }}
data:
  WEBFLIX_MODE: k8s
  WEBFLIX_ENV: {{ .Values.config.environment | quote }}
  WEBFLIX_PUBLIC_ORIGIN: {{ include "webflix.publicOrigin" . | quote }}
  WEBFLIX_LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  WEBFLIX_MEDIA_TOKEN_TTL_SEC: {{ .Values.config.mediaTokenTtlSec | quote }}
  PORT: "4000"
  # Probes and metrics on their own listener; the public one refuses those paths.
  WEBFLIX_OPS_PORT: "4001"
  WEBFLIX_METRICS: "true"
  # Behind the gateway: client IPs come from X-Forwarded-For, counted from the right.
  WEBFLIX_TRUST_PROXY: "true"
  WEBFLIX_TRUSTED_PROXY_HOPS: {{ .Values.config.trustedProxyHops | quote }}
  WEBFLIX_SHUTDOWN_DELAY_SEC: {{ .Values.api.shutdownDelaySec | quote }}
  WEBFLIX_SCHEDULER_INTERVAL_SEC: {{ .Values.config.schedulerIntervalSec | quote }}
  WEBFLIX_JOBS_CONCURRENCY: {{ .Values.worker.concurrency | quote }}
  # Migrations and seed run as Jobs, never on pod start.
  WEBFLIX_MIGRATE_ON_START: "false"
  WEBFLIX_SEED_ON_START: "false"
  # Database (the password comes from a Secret as PGPASSWORD).
  WEBFLIX_DATABASE_URL: {{ include "webflix.databaseUrl" . | quote }}
  WEBFLIX_DATABASE_POOL_MAX: {{ .Values.api.databasePoolMax | quote }}
  # Shared state: cache, rate limits, stream leases, job queue.
  WEBFLIX_VALKEY_URL: {{ include "webflix.valkeyUrl" . | quote }}
  WEBFLIX_VALKEY_KEY_PREFIX: {{ .Values.config.valkeyKeyPrefix | quote }}
  # Media and artwork (blueprint §2.5: one bucket).
  WEBFLIX_BLOB_STORE: s3
  WEBFLIX_MEDIA_DIR: none
  WEBFLIX_MEDIA_MANIFEST: {{ .Values.seed.manifest | default "none" | quote }}
  {{- if .Values.objectStore.enabled }}
  WEBFLIX_S3_ENDPOINT: {{ printf "http://%s:3900" (include "webflix.component" (list . "objectstore")) | quote }}
  WEBFLIX_S3_REGION: {{ .Values.objectStore.region | quote }}
  WEBFLIX_S3_BUCKET: {{ .Values.objectStore.bucket | quote }}
  WEBFLIX_S3_FORCE_PATH_STYLE: "true"
  {{- else }}
  {{- with .Values.externalS3.endpoint }}
  WEBFLIX_S3_ENDPOINT: {{ . | quote }}
  {{- end }}
  WEBFLIX_S3_REGION: {{ .Values.externalS3.region | quote }}
  WEBFLIX_S3_BUCKET: {{ .Values.externalS3.bucket | quote }}
  WEBFLIX_S3_FORCE_PATH_STYLE: {{ .Values.externalS3.forcePathStyle | quote }}
  {{- end }}
  {{- /* Any policy, present or future: `email-lookup` or `emailLookup` → WEBFLIX_RATE_LIMIT_EMAIL_LOOKUP. */}}
  {{- range $policy, $limit := .Values.config.rateLimits }}
  {{- if $limit }}
  WEBFLIX_RATE_LIMIT_{{ $policy | replace "-" "_" | snakecase | upper }}: {{ $limit | quote }}
  {{- end }}
  {{- end }}
  {{- range $name, $value := .Values.config.extraEnv }}
  {{ $name }}: {{ $value | toString | quote }}
  {{- end }}
