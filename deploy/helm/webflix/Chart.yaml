apiVersion: v2
name: webflix
description: >-
  Webflix streaming platform: API (several replicas), job worker, single-page web app,
  migrations and seed, with optional in-cluster PostgreSQL, Valkey and S3-compatible object
  storage (Garage), routed through the Gateway API.
type: application
version: 0.1.0
appVersion: "0.1.0"
# Pod sysctls tcp_keepalive_intvl/_probes are "safe" from 1.29; Gateway API v1 and the rest
# are tested on 1.31 to 1.37.
kubeVersion: ">=1.31.0-0"
keywords:
  - streaming
  - gateway-api
home: https://github.com/webflix/webflix
# The Webflix mark (apps/web/public/favicon.svg), inline so the chart needs no hosting.
icon: data:image/svg+xml;base64,
annotations:
  # Chart.yaml has no field for it: the Helm this chart is tested and documented with. Releases
  # are applied server-side (field ownership, --force-conflicts); Helm 3 can render it but is
  # not supported. 4.0.0 renders it offline against Kubernetes 1.20 (below kubeVersion).
  webflix.dev/helm-version: ">=4.0.1"
  # Images the chart deploys by default (for scanners and air-gapped mirrors).
  artifacthub.io/images: |
    - name: postgres
      image: postgres:19.0-alpine3.24
    - name: valkey
      image: valkey/valkey:9.2.0-alpine3.24
    - name: garage
      image: dxflrs/garage:v2.5.0
