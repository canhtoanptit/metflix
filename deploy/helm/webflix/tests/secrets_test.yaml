suite: Generated credentials
templates:
  - secrets.yaml
release:
  name: webflix
  namespace: webflix
tests:
  - it: generates every credential once and keeps it on uninstall
    set:
      secrets.generateWithoutCluster: true
    asserts:
      - hasDocuments:
          count: 5
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep
      - documentIndex: 0
        matchRegex:
          path: stringData.WEBFLIX_MEDIA_TOKEN_KEYS
          pattern: ^k1:[A-Za-z0-9]{48}$
      # The app Secret: the pseudonym key, never the development stand-ins' secrets in production.
      - documentIndex: 1
        equal:
          path: metadata.name
          value: webflix-app
      - documentIndex: 1
        matchRegex:
          path: stringData.WEBFLIX_PSEUDONYM_KEY
          pattern: ^[A-Za-z0-9]{48}$
      - documentIndex: 1
        notExists:
          path: stringData.WEBFLIX_DEV_IDP_SECRET
      - documentIndex: 2
        matchRegex:
          path: stringData.password
          pattern: ^[A-Za-z0-9]{32}$
      - documentIndex: 4
        matchRegex:
          path: stringData["access-key-id"]
          pattern: ^GK[0-9a-f]{24}$
      - documentIndex: 4
        matchRegex:
          path: stringData["secret-access-key"]
          pattern: ^[0-9a-f]{64}$
      - documentIndex: 4
        matchRegex:
          path: stringData["rpc-secret"]
          pattern: ^[0-9a-f]{64}$

  - it: shares the development stand-ins' secrets across replicas outside production
    set:
      secrets.generateWithoutCluster: true
      config.environment: development
    asserts:
      - documentIndex: 1
        matchRegex:
          path: stringData.WEBFLIX_DEV_IDP_SECRET
          pattern: ^[A-Za-z0-9]{48}$
      - documentIndex: 1
        matchRegex:
          path: stringData.WEBFLIX_PAYMENTS_FAKE_WEBHOOK_SECRET
          pattern: ^[A-Za-z0-9]{48}$

  - it: generates nothing that an existing Secret provides
    set:
      secrets.existingSecret: media-keys
      secrets.appExistingSecret: app
      postgresql.auth.existingSecret: pg
      valkey.auth.existingSecret: vk
      objectStore.auth.existingSecret: s3
    asserts:
      - hasDocuments:
          count: 0

  - it: generates nothing for external services
    set:
      secrets.generateWithoutCluster: true
      postgresql.enabled: false
      externalDatabase.url: postgres://u@db:5432/webflix
      valkey.enabled: false
      externalValkey.url: redis://cache:6379
      objectStore.enabled: false
    asserts:
      - hasDocuments:
          count: 2

  # helm-unittest renders like `helm template`: no cluster, `lookup` sees nothing.
  - it: refuses to generate credentials without cluster access (Argo CD, helm template)
    asserts:
      - failedTemplate:
          errorMessage: "webflix: rendering without cluster access (helm template, Argo CD, Flux…) cannot keep generated credentials stable. Create the Secrets and set secrets.existingSecret, secrets.appExistingSecret, postgresql.auth.existingSecret, valkey.auth.existingSecret and objectStore.auth.existingSecret (and keycloak.tls.secretName with Keycloak), or use external services; set secrets.generateWithoutCluster=true only for throwaway renders such as CI schema checks."

  - it: renders without cluster access when every credential comes from an existing Secret
    set:
      secrets.existingSecret: media-keys
      secrets.appExistingSecret: app
      postgresql.auth.existingSecret: pg
      valkey.auth.existingSecret: vk
      objectStore.auth.existingSecret: s3
    asserts:
      - hasDocuments:
          count: 0
