suite: Pipeline CronJobs, Keycloak and the mail catcher
release:
  name: webflix
  namespace: webflix
set:
  secrets.generateWithoutCluster: true
  pipeline.enabled: true
  config.environment: development
tests:
  - it: serialises the lake jobs in one round on Garage (no conditional writes)
    template: pipeline/cronjobs.yaml
    asserts:
      - hasDocuments:
          count: 4
      - documentIndex: 1
        equal:
          path: metadata.name
          value: webflix-recs-lake-round
      - documentIndex: 1
        equal:
          path: spec.concurrencyPolicy
          value: Forbid
      - documentIndex: 1
        equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].command
          value: [python, /scripts/lake_round.py]
      # The pipeline refuses the lake jobs on Garage (exit 10) unless the scheduler is declared the lock.
      - documentIndex: 1
        contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: WEBFLIX_RECS_LAKE_SERIALIZED
            value: "true"
  - it: leaves the worker count to the pipeline unless pipeline.workers is set
    template: pipeline/cronjobs.yaml
    documentIndex: 2
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].args
          value: [--store, s3://webflix-media, analyse-experiments, --definitions, api]
  - it: passes pipeline.workers to every job
    template: pipeline/cronjobs.yaml
    documentIndex: 2
    set:
      pipeline.workers: 4
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].args
          value:
            [--store, s3://webflix-media, --workers, "4", analyse-experiments, --definitions, api]
  - it: runs separate CronJobs on a store that honours conditional writes
    template: pipeline/cronjobs.yaml
    set:
      objectStore.enabled: false
      externalS3.bucket: acme-media
    asserts:
      - hasDocuments:
          count: 7
      - documentIndex: 1
        equal:
          path: metadata.name
          value: webflix-recs-compact
      - documentIndex: 1
        contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].args
          content: s3://acme-media
      # Each takes the lease itself there: nothing declares the scheduler the lock.
      - documentIndex: 1
        notContains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: WEBFLIX_RECS_LAKE_SERIALIZED
            value: "true"
      - documentIndex: 3
        equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].args
          value: [--store, s3://acme-media, export-events, --grace-minutes, "15"]
  - it: gets the jobs' token from the development issuer outside production
    template: pipeline/cronjobs.yaml
    documentIndex: 1
    asserts:
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: WEBFLIX_STAFF_TOKEN_URL
            value: http://webflix-api/dev-idp/staff/token
  - it: gets it from Keycloak's service account when Keycloak is enabled
    template: pipeline/cronjobs.yaml
    documentIndex: 1
    set:
      config.environment: production
      keycloak.enabled: true
    asserts:
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: WEBFLIX_STAFF_TOKEN_URL
            value: https://webflix-keycloak:8443/realms/webflix/protocol/openid-connect/token
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: WEBFLIX_STAFF_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: webflix-keycloak
                key: jobs-client-secret
  - it: refuses a production pipeline that cannot reach the staff API
    template: pipeline/cronjobs.yaml
    set:
      config.environment: production
    asserts:
      - failedTemplate:
          errorMessage: "webflix: the pipeline's erase, exportEvents and analyse jobs call the staff API with a service account: set pipeline.staffApi.tokenUrl (and existingSecret), or enable keycloak"
  - it: splits train-and-score around the Node rule-engine step, then imports
    template: pipeline/cronjobs.yaml
    documentIndex: 3
    asserts:
      - equal:
          path: metadata.name
          value: webflix-recs-train-and-score
      - equal:
          path: spec.jobTemplate.spec.template.spec.initContainers[0].name
          value: catalog
      - equal:
          path: spec.jobTemplate.spec.template.spec.initContainers[1].name
          value: catalog-upload
      - equal:
          path: spec.jobTemplate.spec.template.spec.initContainers[2].name
          value: prepare
      - equal:
          path: spec.jobTemplate.spec.template.spec.initContainers[3].name
          value: rule-engine
      - equal:
          path: spec.jobTemplate.spec.template.spec.initContainers[3].command
          value:
            [
              node,
              services/recs/scripts/rule-engine-rankings.ts,
              --input,
              /work/train/engine-input.ndjson,
              --out-dir,
              /work/train,
            ]
      # prepare and finish read the erasure list from the staff API with the service account.
      - contains:
          path: spec.jobTemplate.spec.template.spec.initContainers[2].env
          content:
            name: WEBFLIX_ADMIN_API_URL
            value: http://webflix-api/api/admin/v1
      - contains:
          path: spec.jobTemplate.spec.template.spec.initContainers[4].env
          content:
            name: WEBFLIX_STAFF_CLIENT_ID
            value: webflix-jobs
      - equal:
          path: spec.jobTemplate.spec.template.spec.initContainers[4].name
          value: finish
      - equal:
          path: spec.jobTemplate.spec.template.spec.initContainers[5].name
          value: publish
      # The importer, where "nothing published yet" is not a failure.
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].command[0]
          value: sh
      - matchRegex:
          path: spec.jobTemplate.spec.template.spec.containers[0].command[2]
          pattern: "node apps/api/src/recs.ts import.*No recs/current.json"
      # Exit 3 (imported, the shared cache not told): the Job succeeds and says so.
      - matchRegex:
          path: spec.jobTemplate.spec.template.spec.containers[0].command[2]
          pattern: "if \\[ \"\\$code\" = 3 \\]; then note='imported, but the shared cache could not be told.*'; code=0;.*/dev/termination-log"
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].terminationMessagePolicy
          value: FallbackToLogsOnError
  - it: budgets train-and-score on its own (resources, deadline, /work) and keeps the others small
    template: pipeline/cronjobs.yaml
    asserts:
      - documentIndex: 3
        equal:
          path: spec.jobTemplate.spec.activeDeadlineSeconds
          value: 7200
      - documentIndex: 3
        equal:
          path: spec.jobTemplate.spec.template.spec.initContainers[2].resources.limits.memory
          value: 4Gi
      - documentIndex: 3
        equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].resources.limits.memory
          value: 4Gi
      - documentIndex: 3
        contains:
          path: spec.jobTemplate.spec.template.spec.volumes
          content:
            name: work
            emptyDir:
              sizeLimit: 4Gi
      - documentIndex: 1
        equal:
          path: spec.jobTemplate.spec.activeDeadlineSeconds
          value: 3600
      - documentIndex: 1
        equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].resources.limits.memory
          value: 2Gi
  - it: sizes train-and-score for a member base near the full simulated size
    template: pipeline/cronjobs.yaml
    documentIndex: 3
    set:
      pipeline.jobs.trainAndScore.resources:
        requests: { cpu: "2", memory: 12Gi }
        limits: { cpu: "4", memory: 12Gi }
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.initContainers[4].resources.requests.memory
          value: 12Gi
  - it: imports the realm with the staff client, the audience, the roles and the jobs' account
    template: keycloak/secrets.yaml
    set:
      keycloak.enabled: true
    documentIndex: 1
    asserts:
      - matchRegex:
          path: stringData["webflix-realm.json"]
          pattern: '"included.custom.audience":"webflix-admin-api"'
      - matchRegex:
          path: stringData["webflix-realm.json"]
          pattern: '"serviceAccountClientId":"webflix-jobs"'
      - matchRegex:
          path: stringData["webflix-realm.json"]
          pattern: '"redirectUris":\["http://localhost:8080/admin/auth/callback"\]'
  - it: runs Keycloak in production mode over HTTPS with its database in PostgreSQL
    template: keycloak/deployment.yaml
    set:
      keycloak.enabled: true
    asserts:
      - documentIndex: 0
        equal:
          path: spec.template.spec.containers[0].args
          value: [start, --import-realm]
      - documentIndex: 0
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KC_DB_URL
            value: jdbc:postgresql://webflix-postgresql:5432/keycloak
      - documentIndex: 0
        equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.scheme
          value: HTTPS
  - it: runs the mail catcher unprivileged with a writable data volume
    template: mailcatcher/deployment.yaml
    set:
      mailcatcher.enabled: true
    asserts:
      - documentIndex: 0
        equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - documentIndex: 0
        equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
  - it: runs retention last in the lake round, daily, by default
    template: pipeline/cronjobs.yaml
    documentIndex: 1
    asserts:
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: LAKE_RETAIN
            value: "true"
  - it: runs retention as its own CronJob on a store that honours conditional writes
    template: pipeline/cronjobs.yaml
    set:
      objectStore.enabled: false
      externalS3.bucket: acme-media
    asserts:
      - hasDocuments:
          count: 7
      - documentIndex: 4
        equal:
          path: metadata.name
          value: webflix-recs-retain
      - documentIndex: 4
        equal:
          path: spec.schedule
          value: "50 3 * * *"
      - documentIndex: 4
        equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].args
          value: [--store, s3://acme-media, retain]
  - it: gives retention the API's retention settings through the same ConfigMap
    template: pipeline/cronjobs.yaml
    documentIndex: 1
    asserts:
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].envFrom
          content:
            configMapRef:
              name: webflix-config
