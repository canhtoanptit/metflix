# Security headers for every SPA response (included per location: nginx's add_header does not
# inherit once a location adds its own). The Helm chart mounts its own copy of this file, so
# the policy can be tuned per environment without rebuilding the image.
#
# CSP: everything same-origin, except media and XHR over https for titles that fall back to an
# external HLS stream before packaged media is uploaded. hls.js needs blob: for MediaSource
# and its worker; ThumbHash placeholders are data: images; Motion and Radix set inline styles.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; media-src 'self' blob: https:; connect-src 'self' https:; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self \"https://js.stripe.com\" \"https://*.js.stripe.com\"), usb=()" always;
