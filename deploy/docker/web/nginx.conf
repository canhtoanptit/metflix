# Webflix SPA server. Behind the gateway, which routes /api, /media and /cdn to the API and
# everything else here. Runs unprivileged with a read-only root filesystem (writes only /tmp).
#
#   /assets/*      hashed build output: cached for a year, immutable
#   /index.html    the app shell: always revalidated (ETag), so a deploy is seen on next load
#   other files    favicons, web manifest: an hour
#   missing file   404 problem document, `no-store`: anything under /assets/, and any path whose
#                  last segment has an extension unless it is a page load (same rule as the
#                  Cloudflare Worker), so a script or image URL never receives the HTML shell
#   anything else  the app shell (client-side routing), never cached
#   :8081/healthz  probes, not routed by the gateway
worker_processes auto;
# A rolling update sends SIGQUIT: finish in-flight requests, then exit.
worker_shutdown_timeout 20s;
error_log /dev/stderr notice;
pid /tmp/nginx.pid;

events {
  worker_connections 4096;
}

http {
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  include /etc/nginx/mime.types;
  types {
    application/manifest+json webmanifest;
    text/javascript mjs;
  }
  default_type application/octet-stream;
  charset utf-8;
  charset_types text/css text/plain text/javascript application/javascript application/json
                application/manifest+json image/svg+xml;

  # One JSON object per line, like the API's logs.
  # A page load: Fetch Metadata says so, or (older clients) the request accepts HTML.
  map "$http_sec_fetch_mode|$http_accept" $navigation {
    "~^navigate\|" 1;
    "~^\|.*text/html" 1;
    default 0;
  }
  # A miss on a path that names a file and is not a page load: a missing static file.
  map "$navigation|$uri" $file_miss {
    "~^0\|.*/[^/]*\.[A-Za-z0-9]+$" 1;
    default 0;
  }

  log_format json escape=json
    '{"time":"$time_iso8601","level":"info","msg":"http.request","service":"webflix-web",'
    '"method":"$request_method","path":"$uri","status":$status,"bytes":$body_bytes_sent,'
    '"durationSec":$request_time,"requestId":"$http_x_request_id",'
    '"forwardedFor":"$http_x_forwarded_for","userAgent":"$http_user_agent"}';
  access_log /dev/stdout json;

  server_tokens off;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65s;
  # The gateway reuses upstream connections; let it close them first.
  keepalive_requests 10000;

  # Pre-compressed .gz files are served as-is; anything else compressible on the fly.
  gzip_static on;
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/css text/plain text/javascript application/javascript application/json
             application/manifest+json image/svg+xml application/wasm;

  server {
    listen 8080 default_server;
    root /usr/share/nginx/html;
    index index.html;
    # Redirects must never expose the container port.
    absolute_redirect off;

    # Every 404 (missing asset, file-like miss, server-owned path) is a problem document that
    # is never cached: a later deploy may add the file, and a script tag must never get HTML.
    error_page 404 = @missing;
    location @missing {
      # No extension-based type (a missing .webp must not be labelled image/webp).
      types { }
      default_type application/problem+json;
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-store" always;
      return 404 '{"type":"urn:webflix:problem:not_found","title":"Not found","status":404,"code":"not_found"}';
    }

    # Caching headers apply to successful responses only (no `always`): a 404 must never be
    # cached as immutable.
    location /assets/ {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "public, max-age=31536000, immutable";
      # A missing asset is a 404, never the app shell (an old tab asking for a chunk a newer
      # deploy no longer has must fail loudly, and a .js URL must never return HTML).
      try_files $uri =404;
    }

    location = /index.html {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-cache" always;
    }

    # Server-owned paths: the gateway sends /api, /media and /cdn to the API and keeps the
    # API's ops endpoints internal. Never answer any of them with the app shell.
    location ~ ^/(api|media|cdn)(/|$) {
      return 404;
    }
    location ~ ^/(healthz|readyz|metrics)$ {
      return 404;
    }

    location / {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "public, max-age=3600";
      try_files $uri @app;
    }

    location @app {
      if ($file_miss) {
        return 404;
      }
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-cache" always;
      rewrite ^ /index.html break;
    }
  }

  # Probes and status for the platform; not exposed through the gateway.
  server {
    listen 8081;
    access_log off;
    location = /healthz {
      default_type text/plain;
      return 200 "ok\n";
    }
    location = /stub_status {
      stub_status;
    }
  }
}
