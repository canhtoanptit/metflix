# Security headers for the staff console under /admin/ (included per location, as the member
# app's are). Its own policy, stricter than the member app's: scripts, styles and data from this
# origin only, and requests (connect-src) to this origin and the staff issuer only; none of the
# media hosts, Stripe or Maps origins the member app's policy admits. This default suits the
# development issuer, which the API serves on this origin (/dev-idp/staff); the Helm chart
# mounts its own copy with the configured issuer's origin (templates/web/admin.yaml).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; manifest-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
