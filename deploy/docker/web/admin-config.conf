# /admin/config.json, the staff console's settings ({issuer, clientId, scope}: apps/admin/server/
# console-config.ts). This default serves the file the console's build wrote (the development
# issuer on this origin); the Helm chart mounts its own answer from the release's staff issuer
# (templates/web/admin.yaml). Never cached: a platform replaces it without rebuilding.
default_type application/json;
add_header Cache-Control "no-store" always;
add_header X-Content-Type-Options "nosniff" always;
try_files /admin/config.json =404;
