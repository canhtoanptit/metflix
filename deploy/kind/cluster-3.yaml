# Local Kubernetes for Webflix, failure-injection size: one control plane and two workers in
# two zones, so a node can be taken away (k8s-outage, k8s-partition) and spread across zones is
# observable (k8s-spread). Created by `make k8s-up NODES=3`; everyday work uses cluster.yaml
# (one node).
#
# The gateway's Envoy listens on NodePort 30080 (see gateway.yaml); the control-plane
# container publishes it as http://localhost:8080 on the host, bound to loopback only.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: webflix
nodes:
  - role: control-plane
    # kind v0.33 release image for Kubernetes 1.37 (digest pinned, as kind requires).
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8080
        listenAddress: "127.0.0.1"
        protocol: TCP
  - role: worker
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    labels:
      topology.kubernetes.io/zone: zone-a
  - role: worker
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    labels:
      topology.kubernetes.io/zone: zone-b
