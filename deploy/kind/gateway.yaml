# Cluster-level gateway setup for kind (applied by `make k8s-up` after Envoy Gateway is
# installed). On a real cluster the platform team owns the GatewayClass; the chart only needs
# its name (`gateway.className`).
#
# EnvoyProxy: how Envoy Gateway runs the data plane for Gateways of this class. Here: a
# NodePort Service on 30080 (published by kind as localhost:8080), two Envoy replicas, and
# a drain period long enough for rolling updates of Envoy itself.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: webflix-kind
  namespace: envoy-gateway-system
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        replicas: 2
        container:
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
        # The shutdown-manager sidecar ships without limits.
        patch:
          type: StrategicMerge
          value:
            spec:
              template:
                spec:
                  containers:
                    - name: shutdown-manager
                      resources:
                        limits:
                          cpu: 100m
                          memory: 64Mi
      envoyService:
        type: NodePort
        externalTrafficPolicy: Cluster
        patch:
          type: StrategicMerge
          value:
            spec:
              ports:
                - port: 80
                  nodePort: 30080
  shutdown:
    drainTimeout: 15s
    minDrainDuration: 5s
  # Access logs, JSON on stdout, kept to what operating the gateway needs. The path is logged
  # without its query string (%PATH(NQ)%): queries carry what members search for
  # (/api/v1/search?q=), the addresses staff look up (/api/admin/v1/members?q=), export download
  # tokens and OpenID codes and states. No client address and no user agent: the request id
  # correlates a line with the API's own log line, and the API decides what it keeps (rate limits
  # key on addresses in Valkey, with their expiry). Signed media URLs carry the playback token in
  # the path (/media/<token>/vod/...), so those requests are logged without their path at all.
  # Retention: these are container logs, rotated by the kubelet (10 MiB × 5 files per container
  # by default) and gone with the pod; a cluster's log pipeline must keep them no longer than
  # their purpose needs (docs/KUBERNETES.md §3, "Access logs").
  telemetry:
    accessLog:
      settings:
        - matches:
            - "!request.path.startsWith('/media/')"
          format:
            type: JSON
            json:
              path: "%PATH(NQ)%"
              start_time: "%START_TIME%"
              method: "%REQ(:METHOD)%"
              protocol: "%PROTOCOL%"
              response_code: "%RESPONSE_CODE%"
              response_flags: "%RESPONSE_FLAGS%"
              response_code_details: "%RESPONSE_CODE_DETAILS%"
              bytes_received: "%BYTES_RECEIVED%"
              bytes_sent: "%BYTES_SENT%"
              duration: "%DURATION%"
              upstream_host: "%UPSTREAM_HOST%"
              request_id: "%REQ(X-REQUEST-ID)%"
              route_name: "%ROUTE_NAME%"
          sinks:
            - type: File
              file:
                path: /dev/stdout
        - matches:
            - "request.path.startsWith('/media/')"
          format:
            type: JSON
            json:
              path: "/media/[redacted]"
              start_time: "%START_TIME%"
              method: "%REQ(:METHOD)%"
              protocol: "%PROTOCOL%"
              response_code: "%RESPONSE_CODE%"
              response_flags: "%RESPONSE_FLAGS%"
              response_code_details: "%RESPONSE_CODE_DETAILS%"
              bytes_received: "%BYTES_RECEIVED%"
              bytes_sent: "%BYTES_SENT%"
              duration: "%DURATION%"
              upstream_host: "%UPSTREAM_HOST%"
              request_id: "%REQ(X-REQUEST-ID)%"
              route_name: "%ROUTE_NAME%"
          sinks:
            - type: File
              file:
                path: /dev/stdout
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: webflix
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: webflix-kind
    namespace: envoy-gateway-system
