# Local Kubernetes for Webflix, everyday size: one node (the control plane, which kind lets run
# workloads when it is alone). Created by `make k8s-up` (NODES=1, the default). Replicas, the
# job worker, migrations, the pipeline's CronJobs and the conformance suite all run on it; only
# the failure-injection targets that take a node away or spread over zones need
# cluster-3.yaml (`make k8s-up NODES=3`), and they refuse to run on this one.
#
# The gateway's Envoy listens on NodePort 30080 (see gateway.yaml); the node container
# publishes it as http://localhost:8080 on the host, bound to loopback only.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: webflix
nodes:
  - role: control-plane
    # kind v0.33 release image for Kubernetes 1.37 (digest pinned, as kind requires).
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    labels:
      topology.kubernetes.io/zone: zone-a
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8080
        listenAddress: "127.0.0.1"
        protocol: TCP
