# Webflix on the local kind cluster (make k8s-up). Overrides of the chart's production-leaning
# defaults: smaller footprint (with CPU limits, so the cluster can never take over the laptop)
# and the kind GatewayClass; behaviour (rate limits, environment, security) stays production.
# Images (repository and content-derived tag) are passed by deploy/kind/up.sh.
#
# Milestone 2 in its production configuration: the staff issuer is the in-chart Keycloak (the
# console client, the webflix-admin-api audience, the roles, demo staff, the jobs' service
# account), email leaves through SMTP to the in-chart mail catcher, behaviour events go to the
# lake in the bucket, and the pipeline's CronJobs run against it with Keycloak's service
# account. No payment provider is configured: production refuses the fake one and Stripe's test
# keys, so checkout stays closed (the conformance variant, values-conformance.yaml, has the fake).

config:
  publicOrigin: http://localhost:8080
  # Rate limits: the production (strict) defaults, as in a real deployment. Everyone on this
  # machine reaches the gateway from one client address, so heavy local test runs can opt into
  # the documented relaxed profile: make k8s-up RATE_LIMITS=relaxed (values-relaxed-limits.yaml).
  # Stats rollups and the daily baseline every minute instead of every five.
  schedulerIntervalSec: 60

image:
  # Loaded into the nodes with `kind load`; never pulled.
  pullPolicy: IfNotPresent

api:
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
  resources:
    requests:
      cpu: 100m
      memory: 160Mi
    limits:
      cpu: 1000m
      memory: 512Mi

worker:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 384Mi

web:
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 3
  resources:
    requests:
      cpu: 20m
      memory: 16Mi
    limits:
      cpu: 200m
      memory: 64Mi

postgresql:
  sharedBuffers: 128MB
  persistence:
    size: 2Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 768Mi

valkey:
  # limit >= 2 x maxMemory + 128Mi (fork headroom for AOF rewrites, see the chart values).
  maxMemory: 128mb
  persistence:
    size: 1Gi
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 384Mi

objectStore:
  persistence:
    # The fast media profile is ~50 MB; the full one several GB.
    size: 20Gi
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 512Mi

gateway:
  enabled: true
  # Created by deploy/kind/gateway.yaml (Envoy Gateway, NodePort 30080 → localhost:8080).
  className: webflix

networkPolicy:
  enabled: true

seed:
  # The documented demo account (demo@webflix.dev / webflix-demo) on the local cluster.
  demo: true
  resources:
    requests:
      cpu: 100m
      memory: 192Mi
    limits:
      cpu: 1000m
      memory: 768Mi

keycloak:
  enabled: true
  # One demo staff member per role (password in the webflix-keycloak Secret, key staff-password).
  demoStaff: true
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

mailcatcher:
  enabled: true
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi

pipeline:
  enabled: true
  threads: 2
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1536Mi
  jobs:
    # A young lake and the smoke-size pipeline (peak about 0.5 GB); medium size needs about
    # 2 GB, which this still allows on one CPU (one worker), only slower.
    trainAndScore:
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          cpu: 1000m
          memory: 2560Mi

migrations:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 384Mi
